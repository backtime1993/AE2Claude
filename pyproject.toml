[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ae2claude"
version = "4.3.1"
description = "Native After Effects bridge with a safe MCP interface for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.27,<2",
    "pillow>=11,<13",
]

[project.scripts]
ae2claude = "ae2claude_mcp.cli:main"
ae2claude-mcp = "ae2claude_mcp.server:main"

[tool.setuptools]
py-modules = ["ae_bridge", "ae_native_protocol", "pin_cmd"]

[tool.setuptools.packages.find]
include = ["ae2claude_mcp*"]

[tool.setuptools.data-files]
"share/ae2claude/scripts" = ["scripts/*.jsx", "scripts/registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
