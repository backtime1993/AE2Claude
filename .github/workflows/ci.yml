name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  native-dispatcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -pthread -Wall -Wextra -Werror tests/native_queue_test.cpp -o /tmp/ae-native-queue-test
      - run: /tmp/ae-native-queue-test

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m compileall -q ae2claude_mcp ae_bridge.py ae2claude_server.py tests
      - run: uv run python -m unittest discover -s tests -v

  pinclicker:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extensions/pin-clicker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/pin-clicker/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm run check
