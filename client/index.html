<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AE2Claude PinClicker</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", sans-serif; background:#2b2b2b; color:#ddd; font-size:12px; margin:0; padding:8px; }
        h3 { margin:4px 0 6px; font-size:13px; color:#fff; }
        .row { display:flex; gap:8px; align-items:center; margin:4px 0; }
        .status-ok { color:#8f8; }
        .status-err { color:#f88; }
        .status-pending { color:#fc6; }
        #log { background:#1e1e1e; padding:6px; font-family:Consolas,monospace; font-size:11px; height:180px; overflow:auto; white-space:pre-wrap; border:1px solid #444; }
        code { background:#1e1e1e; padding:1px 4px; border-radius:2px; }
    </style>
</head>
<body>
    <h3>AE2Claude PinClicker</h3>
    <div class="row">HTTP: <code id="endpoint">—</code> <span id="status" class="status-pending">starting…</span></div>
    <div class="row">Requests: <span id="reqcount">0</span> · Errors: <span id="errcount">0</span></div>
    <div id="log"></div>
    <script src="main.js"></script>
</body>
</html>
